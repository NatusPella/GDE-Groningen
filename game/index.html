<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>GTE VI - Grand Theft Eierbal VI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; }
  #game3d { display: block; width: 100vw; height: 100vh; cursor: none; position: fixed; inset: 0; }
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; }
  #loading { position: fixed; inset: 0; background: #111; color: #eee; display: flex;
             align-items: center; justify-content: center; font: 20px/1.4 sans-serif; z-index: 10; }

  /* Gronings groen - the city/FC Groningen green, used as the game's
     primary accent throughout the menus/HUD instead of a generic GTA yellow */
  :root { --gron-green: #1e9e56; --gron-green-light: #3fc97a; --gron-green-dark: #0f5c30; }
  #start-screen {
    position: fixed; inset: 0; z-index: 20; display: none;
    background: radial-gradient(ellipse at center, #17301f 0%, #0c140e 75%);
    color: #f0ede4; font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
    align-items: center; justify-content: center;
  }
  #start-screen.visible { display: flex; }
  #start-card { max-width: 480px; padding: 32px 40px; text-align: center; }
  #start-card h1 {
    font-size: 38px; margin: 0 0 4px; letter-spacing: 2px; color: var(--gron-green-light);
    text-shadow: 0 2px 6px rgba(0,0,0,0.6), 0 0 22px rgba(63,201,122,0.35);
  }
  #start-card .sub { font-size: 15px; opacity: 0.8; margin: 0 0 4px; }
  #start-card .hint-note { font-size: 12px; opacity: 0.6; margin: 0 0 20px; font-style: italic; }
  #controls-grid { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; text-align: left; font-size: 15px; margin: 0 auto 28px; width: fit-content; align-items: center; }
  /* Same keycap-chip recipe as .hud-key in hud_panel.css - that stylesheet
     is scoped to #hud (injected by hud_panel.js) so it can't be reused
     directly here; this is the single approved keycap look duplicated for
     the one screen that renders outside #hud. */
  #controls-grid .key {
    display: inline-flex; align-items: center; justify-content: center;
    justify-self: end; min-width: 20px; height: 22px; padding: 0 8px;
    background: linear-gradient(180deg, #4a4f47, #2a2e28);
    border: 1px solid rgba(255,255,255,0.35);
    border-bottom: 2px solid rgba(0,0,0,0.6);
    border-radius: 4px;
    color: var(--gron-green-light);
    font-weight: bold; font-size: 12px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.08) inset;
  }
  #start-btn {
    font: bold 22px 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; letter-spacing: 1.5px; color: #0c140e;
    background: var(--gron-green); border: none; border-radius: 4px; padding: 12px 40px; cursor: pointer;
  }
  #start-btn:hover { background: var(--gron-green-light); }
</style>
</head>
<body>
<canvas id="game3d"></canvas>
<div id="hud"></div>
<div id="loading">Groningen laden…</div>
<div id="start-screen">
  <div id="start-card">
    <h1>GTE VI - Grand Theft Eierbal VI</h1>
    <p class="sub">Een sandbox in de echte straten van de Grunn</p>
    <p class="hint-note">Besturing verschijnt in beeld zodra 'ie relevant is (instappen, wapens, ...)</p>
    <div id="controls-grid">
      <div class="key">WASD</div><div>lopen / rijden</div>
      <div class="key">M</div><div>kaart</div>
      <div class="key">C</div><div>wissel Tammo / Anita</div>
      <div class="key">U</div><div>geluid</div>
    </div>
    <button id="start-btn">Start</button>
  </div>
</div>
<!-- GLTFLoader.js (used by landmarkmodels.js) imports the bare specifier
     "three" internally rather than a full CDN URL like every other module
     in this project - this import map resolves that one bare specifier to
     the exact same three.js build everything else already loads, without
     switching the rest of the codebase off its existing direct-URL imports. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
