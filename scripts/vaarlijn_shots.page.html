<!doctype html>
<meta charset="utf-8">
<title>vaarlijn_shots</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">
{
  "imports": {
    "https://cdn.jsdelivr.net/npm/three@0.160.0/": "/vendor/npm/three@0.160.0/",
    "three": "/vendor/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<canvas id="c" width="1280" height="720"></canvas>
<script type="module">
// Zie scripts/vaarlijn_shots.mjs. Een gracht en een brede rivier met kades, een boot en een vaarroute, met de echte
// code uit game/js: "na" tekent de vaarlijn (scene3d/vaarlijn3d.js), "voor" (de game-map van main) de route-boeien
// (waymarkers3d.js). Het water is hier een vlak, niet het waterschaduwmateriaal van het spel.
const q = new URLSearchParams(location.search);
window.__shots = []; window.__info = {}; window.__done = false;
try {
  const THREE = await import('three');
  let lijn = null;
  try { lijn = await import('/game/js/scene3d/vaarlijn3d.js'); } catch (e) { lijn = null; }
  const WM = await import('/game/js/waymarkers3d.js');
  window.__info = { na: !!lijn };
  const canvas = document.getElementById('c');
  const W = 1280, H = 720;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H, false);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xa9cde8);
  scene.fog = new THREE.Fog(0xa9cde8, 200, 900);
  scene.add(new THREE.HemisphereLight(0xb4cdea, 0x6f6454, 1.2));
  const sun = new THREE.DirectionalLight(0xffe3b0, 2.4); sun.position.set(-30, 60, 40); scene.add(sun);
  const cam = new THREE.PerspectiveCamera(62, W / H, 0.5, 1650);

  const WATER = -2.3;
  const water = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x2f6f8f, roughness: 0.35, metalness: 0.1 }));
  water.position.y = WATER; scene.add(water);

  // een kronkelende vaarweg: x loopt op, z slingert; kades als lange dozen rond het water
  const kanaal = (breed) => {
    const mid = (s) => [s, 40 * Math.sin(s / 140) + (s > 300 ? 0.25 * (s - 300) : 0)];
    const pts = []; for (let s = 0; s <= 700; s += 10) pts.push(mid(s));
    return { pts, breed };
  };
  const bouwOevers = (k) => {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: 0x8c8374, roughness: 1 });
    for (const side of [1, -1]) {
      for (let i = 1; i < k.pts.length; i++) {
        const a = k.pts[i - 1], b = k.pts[i];
        const dx = b[0] - a[0], dz = b[1] - a[1], L = Math.hypot(dx, dz);
        const nx = -dz / L, nz = dx / L;
        const m = new THREE.Mesh(new THREE.BoxGeometry(L + 0.2, 2.6, 30), mat);
        m.position.set((a[0] + b[0]) / 2 + nx * (k.breed / 2 + 15) * side, WATER + 1.3 - 0.5, (a[1] + b[1]) / 2 + nz * (k.breed / 2 + 15) * side);
        m.rotation.y = -Math.atan2(dz, dx);
        g.add(m);
      }
    }
    return g;
  };
  const boot = new THREE.Group();
  const romp = new THREE.Mesh(new THREE.BoxGeometry(5, 0.8, 1.9), new THREE.MeshStandardMaterial({ color: 0xe8e6e0 })); romp.position.y = 0.4;
  const hut = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 1.5), new THREE.MeshStandardMaterial({ color: 0x1d4f9c })); hut.position.set(0.3, 1.3, 0);
  boot.add(romp, hut); scene.add(boot);

  const route = (k) => {
    const pts = k.pts.slice();
    const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    return { pts, cum, length: cum[cum.length - 1], remaining: cum[cum.length - 1], mode: 'boat', kind: 'mission', idx: 0, px: pts[0][0], py: pts[0][1], version: 1, target: { x: pts[pts.length - 1][0], y: pts[pts.length - 1][1] } };
  };
  const ahead = (r) => (maxLen) => {
    const out = [[r.px, r.py]]; let acc = 0, prev = out[0];
    for (let i = r.idx + 1; i < r.pts.length; i++) {
      const p = r.pts[i], d = Math.hypot(p[0] - prev[0], p[1] - prev[1]);
      if (acc + d >= maxLen) { const t = (maxLen - acc) / (d || 1); out.push([prev[0] + (p[0] - prev[0]) * t, prev[1] + (p[1] - prev[1]) * t]); break; }
      acc += d; out.push(p); prev = p;
    }
    return out;
  };

  async function shoot(name, k, camFn) {
    const oevers = bouwOevers(k);
    scene.add(oevers);
    const r = route(k);
    boot.position.set(r.pts[0][0], WATER, r.pts[0][1]);
    boot.rotation.y = -Math.atan2(r.pts[1][1] - r.pts[0][1], r.pts[1][0] - r.pts[0][0]);
    const world = { map: { waterNear: () => [] } };
    for (let i = 0; i < 40; i++) {
      if (lijn) lijn.updateVaarlijn3D(0.05, scene, r, ahead(r), world, '#e8c93a');
      else WM.updateWaymarkers3D(scene, i * 0.05, r, ahead(r)(260), cam);
    }
    camFn(cam, r);
    renderer.render(scene, cam);
    window.__shots.push({ name, png: canvas.toDataURL('image/png') });
    scene.remove(oevers);
    if (lijn) lijn.hideVaarlijn3D(); else WM.hideWaymarkers3D();
  }
  const achterBoot = (h, back, look) => (c, r) => { const [x, z] = r.pts[0]; c.position.set(x - back, WATER + h, z); c.lookAt(x + look, WATER, z + 8); c.fov = 62; c.updateProjectionMatrix(); };
  await shoot('gracht', kanaal(12), achterBoot(4.5, 14, 90));
  await shoot('reitdiep', kanaal(60), achterBoot(7, 18, 120));
  await shoot('hoog', kanaal(24), (c, r) => { c.position.set(260, 220, 110); c.lookAt(260, WATER, 25); c.fov = 55; c.updateProjectionMatrix(); });
  if (lijn) {
    // de terugval: geen vaarroute, een gestippelde luchtlijn
    const k = kanaal(24); const r = route(k); r.noRoute = true; r.pts = [r.pts[0], r.pts[r.pts.length - 1]]; r.cum = [0, 700]; r.length = r.remaining = 700;
    scene.add(bouwOevers(k));
    boot.position.set(r.pts[0][0], WATER, r.pts[0][1]);
    for (let i = 0; i < 40; i++) lijn.updateVaarlijn3D(0.05, scene, r, ahead(r), { map: { waterNear: () => [] } }, '#e8c93a');
    achterBoot(4.5, 14, 90)(cam, r); renderer.render(scene, cam);
    window.__shots.push({ name: 'terugval', png: canvas.toDataURL('image/png') });
    window.__info.status = lijn.vaarlijnStatus();
  }
} catch (e) {
  window.__info = { fout: String((e && e.stack) || e) };
}
window.__done = true;
</script>
