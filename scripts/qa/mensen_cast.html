<!doctype html>
<meta charset="utf-8">
<title>Mensen fase 2: de vaste personages, eigen model naast modulair</title>
<script type="importmap">{ "imports": { "https://cdn.jsdelivr.net/npm/": "/cdn/" } }</script>
<style>html,body{margin:0;background:#222;color:#eee;font:13px system-ui,sans-serif}canvas{display:block}#info{position:absolute;left:8px;top:4px;white-space:pre;text-shadow:0 1px 2px #000}</style>
<canvas id="c" width="1600" height="1100"></canvas>
<div id="info">laden...</div>
<script>window.addEventListener('error', (e) => fetch('/__klaar', { method: 'POST', body: JSON.stringify({ fout: e.message }) }));
window.addEventListener('unhandledrejection', (e) => fetch('/__klaar', { method: 'POST', body: JSON.stringify({ fout: String(e.reason && e.reason.stack || e.reason) }) }));</script>
<script type="module">
// Fase 2 (cutscenes, ?mensen=q2): de vaste looks naast elkaar, boven het eigen model, daaronder dezelfde look als modulaire mens
// (modularlooks.js), en een rij van dichtbij met open mond (lipsync) en een zittende figuur.
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const P = await import('/game/js/models3d_people.js');
const M = await import('/game/js/modularpeople.js');
const A = await import('/game/js/actoranim.js');
const C = await import('/game/js/storycast.js');
await M.loadModularPeople('/game/models/mensen/');
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setScissorTest(true);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9c7de);
scene.add(new THREE.HemisphereLight(0xdfeaff, 0x7a6f5c, 1.5));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.2); sun.position.set(2, 4, 3); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x8a8f86, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const CAST = [['Tammo', P.TAMMO_APPEARANCE], ['Tessa', P.ANITA_APPEARANCE], ['Jelle', C.JELLE_LOOK], ['Durk', C.DURK_LOOK], ['Douwe', C.DOUWE_LOOK], ['Rikus', C.RIKUS_LOOK], ['Mem', C.MEM_LOOK], ['Beppe', C.BEPPE_LOOK]];
const row = (make) => { const g = new THREE.Group(); CAST.forEach(([n, a], i) => { const m = make(a); if (!m) return; m.position.set((i - 3.5) * 1.1, 0, 0); m.rotation.y = -1.25; g.add(m); }); return g; };
const ons = row((a) => { const m = P.buildPersonMesh(a.shirt, a.skin, a); for (let f = 0; f < 20; f++) P.animatePersonWalk(m, 0, 1 / 60); return m; });
const hun = row((a) => { const m = M.buildModularFromAppearance(a); for (let f = 0; f < 20; f++) A.animateActor(m, { anim: 'idle', dt: 1 / 60 }); return m; });
const kop = row((a) => { const m = M.buildModularFromAppearance(a); for (let f = 0; f < 37; f++) A.animateActor(m, { anim: 'talk', speaking: true, dt: 1 / 60 }); return m; });
kop.children.forEach((m, i) => { m.rotation.y = -1.45; m.position.x = (i - 3.5) * 0.55; });
const zit = new THREE.Group();
CAST.slice(0, 4).forEach(([n, a], i) => { const m = M.buildModularFromAppearance(a); for (let f = 0; f < 90; f++) A.animateActor(m, { anim: i % 2 ? 'talk' : 'idle', seated: true, dt: 1 / 60 }); m.position.set((i - 1.5) * 1.3, 0.45 - M.modularSeatContact(m), 0); m.rotation.y = -0.9; zit.add(m);
  const stoel = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), new THREE.MeshStandardMaterial({ color: 0x6b4a2a })); stoel.position.set((i - 1.5) * 1.3 - 0.02, 0.225, 0); zit.add(stoel); });
const shoot = (group, x, y, w, h, cam) => { scene.add(group); renderer.setViewport(x, y, w, h); renderer.setScissor(x, y, w, h); renderer.render(scene, cam); scene.remove(group); };
const camRow = new THREE.PerspectiveCamera(22, 1600 / 300, 0.1, 100); camRow.position.set(0, 1.0, 13); camRow.lookAt(0, 0.92, 0);
const camFace = new THREE.PerspectiveCamera(10, 1600 / 250, 0.1, 100); camFace.position.set(0, 1.6, 4.4); camFace.lookAt(0, 1.58, 0);
const camZit = new THREE.PerspectiveCamera(26, 1600 / 250, 0.1, 100); camZit.position.set(0, 1.0, 7.5); camZit.lookAt(0, 0.65, 0);
renderer.setClearColor(0x222222); renderer.setScissor(0, 0, 1600, 1100); renderer.setViewport(0, 0, 1600, 1100); renderer.clear();
shoot(ons, 0, 800, 1600, 300, camRow);
shoot(hun, 0, 500, 1600, 300, camRow);
shoot(kop, 0, 250, 1600, 250, camFace);
shoot(zit, 0, 0, 1600, 250, camZit);
renderer.setScissor(0, 0, 1600, 1100); renderer.setViewport(0, 0, 1600, 1100);
document.getElementById('info').textContent = 'rij 1: eigen model; rij 2: modulair (' + CAST.map((c) => c[0]).join(', ') + '); rij 3: pratend (mond open); rij 4: zittend op een stoel van 0,45 m';
window.__klaar = true;
fetch('/__klaar', { method: 'POST', body: JSON.stringify({ ok: true }) }).catch(() => {});
</script>
