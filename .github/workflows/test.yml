# Tests (#140): node --check, voice_coverage, alle scripts/*_test.mjs en de
# Python-tests, op Linux en Windows. Lokaal: node scripts/run_tests.mjs
# Geen geheimen of externe diensten; alleen de standaard Actions. De stage-stap
# haalt three.js en lettertypen op bij jsDelivr/Google Fonts (zoals elke build).
name: Tests

on:
  pull_request:
  # sinds #576: ook op main, zodat een tag niet op een ongeteste commit kan staan.
  # Op een push draait alleen de Linux-run (zie de matrix): de Windows-run kost dubbele
  # gratis minuten en de PR-run dekt Windows al.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","windows-latest"]') }}
    steps:
      # volledige geschiedenis: de geheimenscan leest alle commits (#593 punt 4); een
      # shallow checkout van diepte 1 maakt die scan in de praktijk leeg.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # --ignore-scripts: de Electron-binary is voor de tests niet nodig.
      - name: npm ci
        working-directory: desktop
        run: npm ci --ignore-scripts

      # Haalt three.js en de lettertypen binnen voor de 3D-tests. De wereld wordt hier bewust
      # overgeslagen: data/cache/province (Geofabrik) staat niet in git, en de tests die een
      # wereld nodig hebben slaan zichzelf over. Zonder deze vlag faalde de hele run hier al.
      - name: npm run stage (zonder wereld)
        working-directory: desktop
        run: npm run stage -- --no-world

      - name: Node-tests
        env:
          # Regels- en designcontrole op precies deze wijziging (releasegate, ADR 0034):
          # de PR-basis of de vorige main-commit. De releasegate doet dezelfde controle
          # bij een release op de diff sinds de vorige tag.
          GDE_RULES_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: node scripts/run_tests.mjs

      # Een geheim dat één keer in een commit staat, staat voor altijd in de geschiedenis: de repo is
      # privé en de eigenaar zit op Free, dus GitHub's push protection staat hier niet aan (die vraagt
      # GitHub Pro of een publieke repo). Deze scan is dan het vangnet achter de pre-commit-haak.
      - name: Geheimenscan (werkboom en geschiedenis)
        if: runner.os == 'Linux'
        run: node scripts/secrets_scan.mjs --require-history

      - name: Python-tests
        shell: bash
        run: |
          python -I scripts/world/rdnew_test.py
          python -I scripts/world/extract_province_test.py
          python -I scripts/world/fetch_ahn_test.py
