<!doctype html>
<meta charset="utf-8">
<title>Objecten: contactblad van het straatmeubilair uit het register (headless Chrome, geen Electron)</title>
<style>html,body{margin:0;background:#17301f}canvas{display:block}</style>
<script>
  const root = location.href.replace(/docs\/beeld-23-11\/objecten\/props\.html.*$/, '');
  document.write('<script type="importmap">' + JSON.stringify({ imports: { 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js': root + 'desktop/vendor-cache/npm/three@0.160.0/build/three.module.js', three: root + 'desktop/vendor-cache/npm/three@0.160.0/build/three.module.js', 'three/addons/': root + 'desktop/vendor-cache/npm/three@0.160.0/examples/jsm/', 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/': root + 'desktop/vendor-cache/npm/three@0.160.0/examples/jsm/' } }) + '<\/script>');
</script>
<body>
<script>
  const toon = (t) => { const d = document.createElement('pre'); d.style.cssText = 'position:fixed;top:0;left:0;color:#fff;background:#900;margin:0;padding:8px;font:14px monospace;white-space:pre-wrap;z-index:9'; d.textContent = t; document.body.appendChild(d); };
  window.addEventListener('error', (e) => toon('FOUT: ' + e.message));
  window.addEventListener('unhandledrejection', (e) => toon('FOUT: ' + (e.reason && e.reason.stack || e.reason)));
</script>
<script type="module">
  // Hash: #props[-oud] ("oud" tekent de kale primitieven van vóór 23-11, als vergelijking). Het register zelf: propregister.js.
  const root = location.href.replace(/docs\/beeld-23-11\/objecten\/props\.html.*$/, '');
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
  const { propGeometry } = await import(root + 'game/js/propmodels3d.js');
  const { mergeGeometries, tint } = await import(root + 'game/js/geomerge.js');
  const oud = (location.hash || '#props').includes('oud');
  const W = 1400, H = 800;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H);
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbfe3f2);
  scene.add(new THREE.HemisphereLight(0xf4f2ec, 0x2a3a2e, 1.7));
  const sun = new THREE.DirectionalLight(0xffffff, 2.4); sun.position.set(-6, 9, 8); scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), new THREE.MeshLambertMaterial({ color: 0x8a8d86 }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);
  const MAT = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.75, metalness: 0.15, flatShading: true });
  // de oude vormen uit streetfurniture3d.js (kale dozen en cilinders), voor de vergelijking
  const OUD = {
    bank: () => mergeGeometries([tint(new THREE.BoxGeometry(0.42, 0.06, 1.6).translate(0, 0.45, 0), 0x7a5a3a), tint(new THREE.BoxGeometry(0.05, 0.36, 1.6).translate(-0.2, 0.7, 0), 0x7a5a3a), tint(new THREE.BoxGeometry(0.4, 0.45, 0.06).translate(0, 0.22, -0.7), 0x3a3d40), tint(new THREE.BoxGeometry(0.4, 0.45, 0.06).translate(0, 0.22, 0.7), 0x3a3d40)]),
    afvalbak: () => mergeGeometries([tint(new THREE.CylinderGeometry(0.25, 0.22, 0.85, 8).translate(0, 0.425, 0), 0x2d4a3a)]),
    fietsenrek: () => { const p = []; for (let i = -2; i <= 2; i++) p.push(tint(new THREE.TorusGeometry(0.35, 0.025, 4, 10, Math.PI).translate(0, 0.05, 0).rotateX(0).translate(0, 0, i * 0.5), 0x9a9ea2)); return mergeGeometries(p); },
    bushokje: () => mergeGeometries([tint(new THREE.BoxGeometry(3.2, 0.1, 1.5).translate(0, 2.45, 0), 0x2b3a4a), tint(new THREE.BoxGeometry(3.2, 2.2, 0.04).translate(0, 1.2, -0.7), 0xa9c3cc), tint(new THREE.BoxGeometry(0.06, 2.4, 0.06).translate(-1.55, 1.2, -0.7), 0x2b3a4a), tint(new THREE.BoxGeometry(0.06, 2.4, 0.06).translate(1.55, 1.2, -0.7), 0x2b3a4a)]),
    paaltje: () => mergeGeometries([tint(new THREE.CylinderGeometry(0.08, 0.1, 0.9, 6).translate(0, 0.45, 0), 0x8c2a2a)]),
  };
  const ids = ['bank', 'afvalbak', 'fietsenrek', 'bushokje', 'paaltje'];
  const xs = [-4.4, -2.5, -0.3, 3.4, 6.8];
  ids.forEach((id, i) => {
    let g = oud ? OUD[id]() : propGeometry(id).clone();
    // register: +x voorkant, breedte langs z (bank, afvalbak, rek); het bushokje heeft zijn open kant op +z
    if (!oud && id !== 'bushokje' && id !== 'paaltje') g = g.rotateY(-Math.PI / 2);
    if (oud && (id === 'fietsenrek')) g = g.rotateY(Math.PI / 2);
    const m = new THREE.Mesh(g, MAT);
    m.position.set(xs[i], 0, 0);
    m.rotation.y = 0.35;
    scene.add(m);
  });
  const cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);
  cam.position.set(1.4, 3.4, 12.5); cam.lookAt(1.4, 0.9, 0);
  renderer.render(scene, cam);
  document.title = 'klaar:' + ids.length + ' draws=' + renderer.info.render.calls + ' tris=' + renderer.info.render.triangles;
</script>
