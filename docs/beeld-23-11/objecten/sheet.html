<!doctype html>
<meta charset="utf-8">
<title>Objecten: contactblad van voertuigen (headless Chrome, geen Electron)</title>
<style>html,body{margin:0;background:#17301f}canvas{display:block}</style>
<script>
  const root = location.href.replace(/docs\/beeld-23-11\/objecten\/sheet\.html.*$/, '');
  document.write('<script type="importmap">' + JSON.stringify({ imports: { 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js': root + 'desktop/vendor-cache/npm/three@0.160.0/build/three.module.js', three: root + 'desktop/vendor-cache/npm/three@0.160.0/build/three.module.js', 'three/addons/': root + 'desktop/vendor-cache/npm/three@0.160.0/examples/jsm/', 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/': root + 'desktop/vendor-cache/npm/three@0.160.0/examples/jsm/' } }) + '<\/script>');
</script>
<body>
<script>
  const toon = (t) => { const d = document.createElement('pre'); d.style.cssText = 'position:fixed;top:0;left:0;color:#fff;background:#900;margin:0;padding:8px;font:14px monospace;white-space:pre-wrap;z-index:9'; d.textContent = t; document.body.appendChild(d); };
  window.addEventListener('error', (e) => toon('FOUT: ' + e.message));
  window.addEventListener('unhandledrejection', (e) => toon('FOUT: ' + (e.reason && e.reason.stack || e.reason)));
</script>
<script type="module">
  // Hash: #<set>[-nacht][-achter]. Sets: auto, bak, fiets, bus, boot, heli.
  const root = location.href.replace(/docs\/beeld-23-11\/objecten\/sheet\.html.*$/, '');
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
  const { buildVehicleMesh } = await import(root + 'game/js/models3d_vehicles.js');
  const { BOAT_KINDS } = await import(root + 'game/js/boattypes.js');
  const { syncVehicleDoors } = await import(root + 'game/js/vehicledoors3d.js');
  const mode = (location.hash || '#auto').slice(1);
  const night = mode.includes('nacht') ? 1 : 0;
  const achter = mode.includes('achter');
  const open = mode.includes('open'); // deuren open (alle rollen), voor de deurnaden en uitsparingen
  const zij = mode.includes('zij'); // camera dwars op de zijkant
  const dicht = mode.includes('dicht');
  const set = mode.split('-')[0];
  const W = 1400, H = 800;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H);
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(night ? 0x0b1420 : 0xbfe3f2);
  scene.add(new THREE.HemisphereLight(night ? 0x405070 : 0xf4f2ec, 0x2a3a2e, night ? 0.9 : 1.7));
  const sun = new THREE.DirectionalLight(night ? 0x8090c0 : 0xffffff, night ? 0.8 : 2.4); sun.position.set(4, 8, 5); scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 60), new THREE.MeshLambertMaterial({ color: set === 'boot' ? 0x2b5566 : night ? 0x1c2420 : 0x6b7a66 }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);
  const car = (name, len, wid, color, extra = {}) => ({ model: { name, len, wid, color }, ...extra });
  const bike = (color, rider, extra = {}) => ({ model: { name: 'bike', len: 1.75, wid: 0.5, color, rider }, isBike: true, ...extra });
  const SETS = {
    auto: [car('hatch', 3.8, 1.7, '#c7c9cc'), car('sedan', 4.3, 1.8, '#7a1f1f'), car('wagon', 4.5, 1.8, '#2e4a34'), car('van', 5, 2, '#d9d9d9'), car('sport', 4.1, 1.85, '#8a1414'), car('suv', 4.7, 1.95, '#23262a'),
      car('police', 4.3, 1.8, '#1c1c1c', { isPolice: true }), car('taxi', 4.3, 1.8, '#e8c93a', { isTaxi: true }), car('hatch', 3.8, 1.7, '#e8e6e0')],
    bak: [car('truck', 7, 2.4, '#e8e6e0'), car('tractor', 4.3, 2.3, '#3f7d3a'), car('quad', 2.1, 1.2, '#b8322a'), car('foodtruck', 5.4, 2.1, '#2f6fb0'), car('maaidorser', 7.4, 3.3, '#c43d2b'), car('laadmachine', 3.4, 1.8, '#e0a92b')],
    fiets: [bike('#1c1c1c', '#2f5c8a'), bike('#2b2b2b', '#7a2e2e'), { model: { name: 'bike', fat: true, len: 1.95, wid: 0.62, color: '#20221f', rider: '#8a3a1f' }, isBike: true },
      { model: { name: 'scooter', len: 1.1, wid: 0.4, color: '#e8e6e0', rider: '#7a2e2e' }, isScooter: true }, { model: { name: 'scooter', moped: true, len: 1.7, wid: 0.62, color: '#e6e1d6', rider: '#2f5c8a' }, isScooter: true },
      { model: { name: 'scooter', len: 1.15, wid: 0.42, color: '#c94b3a', rider: '#3f6b3f' }, isScooter: true }],
    bus: [{ model: { name: 'bus', len: 11.2, wid: 2.55, trailer: 6.8, color: '#132a44', stripe: '#3fc6d4', accent: '#e8e6de' }, isBus: true }, { model: { name: 'midibus', len: 8, wid: 2.4, color: '#0f3a4a', stripe: '#3fc6d4', accent: '#e8e6de' }, isBus: true }],
    boot: ['sloep', 'rondvaart', 'kano', 'waterfiets', 'rubberboot', 'dinghy', 'skiff', 'spits'].map((k) => ({ model: { ...BOAT_KINDS[k] }, isBoat: true })),
    limo: [car('trekkerlimo', 5.6, 2, '#141414')],
    deur: [car('sedan', 4.3, 1.8, '#7a1f1f'), car('wagon', 4.5, 1.8, '#2e4a34'), car('van', 5, 2, '#d9d9d9'), car('taxi', 4.3, 1.8, '#e8c93a', { isTaxi: true }), car('tractor', 4.3, 2.3, '#3f7d3a'), car('truck', 8.5, 2.5, '#e8e6e0')],
    heli: [{ model: { name: 'heli', len: 9, wid: 2.4, color: '#c23b2e' }, isHeli: true }],
  };
  const specs = SETS[set];
  const cols = set === 'bus' || set === 'heli' || set === 'limo' ? 1 : 3, vehicles = [];
  const gap = set === 'boot' ? 12 : 7;
  specs.forEach((s, i) => {
    const v = { id: 700 + i, health: 100, ...s };
    const m = buildVehicleMesh(v);
    m.position.set((i % cols - (cols - 1) / 2) * gap, 0, (Math.floor(i / cols) - (Math.ceil(specs.length / cols) - 1) / 2) * (set === 'boot' ? 11 : set === 'bus' ? 10 : 8));
    m.rotation.y = (zij ? 0.22 : 0.7) + (achter ? Math.PI : 0);
    scene.add(m); vehicles.push(m);
    if (open) {
      m.userData.__v = v;
      for (let k = 0; k < 40; k++) for (const rol of ['bestuurder', 'bijrijder', 'achter']) for (const side of [-1, 1]) syncVehicleDoors(m, v, 0.05, { rol, open: true, side });
    }
  });
  const dist = set === 'limo' ? 9 : set === 'deur' ? 17 : set === 'limo' ? 16 : set === 'boot' ? 36 : set === 'bus' ? 24 : set === 'bak' ? 24 : set === 'fiets' ? 12 : set === 'heli' ? 18 : 20;
  const cam = new THREE.PerspectiveCamera(36, W / H, 0.1, 400);
  cam.position.set(0, dist * 0.5, dist); cam.lookAt(0, set === 'fiets' ? 0.5 : 0.8, 0);
  renderer.render(scene, cam);
  document.title = 'klaar:' + vehicles.length + ' draws=' + renderer.info.render.calls + ' tris=' + renderer.info.render.triangles;
</script>
