</style></head><body class="ds-zeef-pagina"><div class="mock-scene"><div id="bench-choice" role="dialog" aria-modal="true" aria-labelledby="bm-titel"><div class="bm-paneel ds-zeef ds-z-kaart ds-z-kaart--recht">
    <div class="ds-z-kaart__kop"><h2 id="bm-titel" class="ds-z-kaart__titel">Benchmark</h2><span class="ds-z-chip">Huidige stand: Hoog</span></div>
    <p class="bm-lead">Meet hoe soepel Grunn op deze computer draait en welke stand daarbij past. Eén scène per keer, elke keer hetzelfde.</p>
    <div class="bm-groep" role="radiogroup" aria-label="Route"><button type="button" role="radio" aria-checked="true" class="bm-keuze ds-z-kaart ds-z-kaart--recht is-gekozen" data-groep="course" data-id="film">
      <span class="ds-z-kaart__titel">Grunn in een dag</span><span class="bm-sub">Een mini-film: zonsopgang, markt, polder, water, kermis, storm en nacht. Met commentaar van Tammo en Tessa.</span><span class="ds-z-chip bm-meta">15 scènes · 59 s</span></button><button type="button" role="radio" aria-checked="false" class="bm-keuze ds-z-kaart ds-z-kaart--recht" data-groep="course" data-id="classic">
      <span class="ds-z-kaart__titel">Klassiek</span><span class="bm-sub">De oorspronkelijke route van eerdere versies. Kies deze om met oude metingen te vergelijken.</span><span class="ds-z-chip bm-meta">11 scènes · 42 s</span></button></div>
    <div class="bm-groep bm-lengte" role="radiogroup" aria-label="Lengte"><button type="button" role="radio" aria-checked="true" class="bm-keuze ds-z-kaart ds-z-kaart--recht is-gekozen" data-groep="length" data-id="volledig">

      <span class="ds-z-kaart__titel">Kort</span><span class="bm-sub">Een keuze uit de zwaarste scènes, ca. 30 s</span></button></div>
    <p class="bm-hulp" data-slot="locked" hidden></p>
    <button type="button" role="switch" class="bm-schakel ds-z-rij" aria-checked="true" data-groep="commentary">
      <span><span class="ds-z-rij__naam">Commentaar van Tammo en Tessa</span><span class="ds-z-rij__sub">Korte ondertitels bij de scènes. Uit telt hetzelfde: de meting verandert er niet door.</span></span>
      <span class="ds-z-chip ds-z-chip--succes" data-slot="commentary-chip">Aan</span></button>
