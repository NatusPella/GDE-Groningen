<!doctype html>
<meta charset="utf-8">
<title>Autotuning: mock van de gepimpte voertuigen (headless Chrome, geen Electron)</title>
<style>html,body{margin:0;background:#17301f}canvas{display:block}</style>
<!-- De spelmodules importeren three van de CDN; de import map wijst die naar de lokale kopie (desktop/vendor-cache). -->
<script>
  const root = location.href.replace(/docs\/beeld-21-11\/tuning\/mock\.html.*$/, '');
  document.write('<script type="importmap">' + JSON.stringify({ imports: { 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js': root + 'desktop/vendor-cache/npm/three@0.160.0/build/three.module.js', three: root + 'desktop/vendor-cache/npm/three@0.160.0/build/three.module.js', 'three/addons/': root + 'desktop/vendor-cache/npm/three@0.160.0/examples/jsm/', 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/': root + 'desktop/vendor-cache/npm/three@0.160.0/examples/jsm/' } }) + '<\/script>');
</script>
<body>
<script>
  const toon = (t) => { const d = document.createElement('pre'); d.style.cssText = 'position:fixed;top:0;left:0;color:#fff;background:#900;margin:0;padding:8px;font:14px monospace;white-space:pre-wrap;z-index:9'; d.textContent = t; document.body.appendChild(d); };
  window.addEventListener('error', (e) => toon('FOUT: ' + e.message));
  window.addEventListener('unhandledrejection', (e) => toon('FOUT: ' + (e.reason && e.reason.stack || e.reason)));
</script>
<script type="module">
  const root = location.href.replace(/docs\/beeld-21-11\/tuning\/mock\.html.*$/, '');
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
  const { buildVehicleMesh } = await import(root + 'game/js/models3d_vehicles.js');
  const { tickVehicleLook } = await import(root + 'game/js/vehiclelook3d.js');
  const { generateLook } = await import(root + 'game/js/vehiclelook.js');
  const mode = (location.hash || '#dag').slice(1);
  const night = mode.startsWith('nacht') ? 1 : 0;
  const W = 1400, H = 800;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H);
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(night ? 0x0b1420 : 0xbfe3f2);
  scene.add(new THREE.HemisphereLight(night ? 0x405070 : 0xf4f2ec, 0x2a3a2e, night ? 0.9 : 1.7));
  const sun = new THREE.DirectionalLight(night ? 0x8090c0 : 0xffffff, night ? 0.8 : 2.4); sun.position.set(4, 8, 5); scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 40), new THREE.MeshLambertMaterial({ color: night ? 0x1c2420 : 0x6b7a66 }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);
  const specs = mode.includes('snack') ? [
    { name: 'foodtruck', len: 5.6, wid: 2.1, color: '#2f6fb0', look: {} },
    { name: 'foodtruck', len: 5.6, wid: 2.1, color: '#f9c80e', look: { awning: 'bos', display: 'vlaggen', beacon: 'ring', air: 'damp', snackName: 'vethap', color2: '#1d1b17' } },
    { name: 'foodtruck', len: 5.6, wid: 2.1, color: '#e8505b', look: { finish: 'pearl', awning: 'zon', display: 'tafel', beacon: 'bak', air: 'bijtjes', snackName: 'tammo', glow: '#6fd3e0', exhaust: 'big', decal: 'frituur', rimStyle: 'star', rimColor: '#f9c80e' } },
    { name: 'foodtruck', len: 5.6, wid: 2.1, color: '#0e6b3c', look: { awning: 'roze', display: 'bord', beacon: 'bak', air: 'geur', snackName: 'eierbal', color2: '#f3ead3', stripe: 'flank', finish: 'matte' } },
  ] : [
    { name: 'sedan', len: 4.6, wid: 1.8, color: '#2e5f9e', look: {} },
    ...['race', 'show', 'rally', 'cruiser'].map((style, i) => { const g = generateLook(11 + i * 5, { style }); return { name: ['sport', 'hatch', 'suv', 'sedan'][i], len: [4.2, 3.9, 4.7, 4.6][i], wid: [1.85, 1.7, 1.95, 1.8][i], color: g.bodyColor, look: g.look }; }),
    { name: 'wagon', len: 4.8, wid: 1.8, color: '#1b1c1f', look: { finish: 'metallic', stripe: 'racing', color2: '#f9c80e', spoiler: 'gt', kit: 'wide', diffuser: 'on', rimStyle: 'mesh', rimColor: '#f3ead3', rimSize: 'l', tire: 'lowprofile', exhaust: 'twin', lamps: 'slit', lampColor: '#4fb3ff', glow: '#ff7ab8', tint: '3', plate: 'ZOMER 21', decal: 'vlam', hanger: 'dice' } },
  ];
  const cols = 3, vehicles = [];
  specs.forEach((s, i) => {
    const v = { id: 500 + i, model: { name: s.name, len: s.len, wid: s.wid, color: s.color }, health: 100, look: Object.keys(s.look).length ? s.look : undefined };
    const m = buildVehicleMesh(v);
    m.position.set((i % cols - 1) * 7, 0, (Math.floor(i / cols) - 0.5) * 8);
    m.rotation.y = 0.7 + (mode.includes('achter') ? Math.PI : 0);
    scene.add(m); vehicles.push(m);
    const ud = m.userData; if (ud.body) { /* de romp staat op de grond */ }
  });
  const cam = new THREE.PerspectiveCamera(36, W / H, 0.1, 200);
  cam.position.set(0, 10.5, 20); cam.lookAt(0, 0.8, 0);
  vehicles.forEach((m) => tickVehicleLook(m, 1.3, night, true));
  renderer.render(scene, cam);
  document.title = 'klaar:' + vehicles.map((m) => m.userData.lookCalls || 0).join(',');
</script>
