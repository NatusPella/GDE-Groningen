<!doctype html>
<meta charset="utf-8">
<title>Voertuigen: voor/na-weergave (headless Chrome, geen spel)</title>
<style>html,body{margin:0;background:#17301f}canvas{display:block}</style>
<script>
  const root = location.href.replace(/docs\/beeld-24-11\/voertuigen\/pagina\.html.*$/, '');
  document.write('<script type="importmap">' + JSON.stringify({ imports: { 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js': root + 'desktop/vendor-cache/npm/three@0.160.0/build/three.module.js', three: root + 'desktop/vendor-cache/npm/three@0.160.0/build/three.module.js', 'three/addons/': root + 'desktop/vendor-cache/npm/three@0.160.0/examples/jsm/', 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/': root + 'desktop/vendor-cache/npm/three@0.160.0/examples/jsm/' } }) + '<\/script>');
</script>
<body>
<script>
  const toon = (t) => { const d = document.createElement('pre'); d.style.cssText = 'position:fixed;top:0;left:0;color:#fff;background:#900;margin:0;padding:8px;font:14px monospace;white-space:pre-wrap;z-index:9'; d.textContent = t; document.body.appendChild(d); document.title = 'FOUT'; };
  window.addEventListener('error', (e) => toon('FOUT: ' + e.message));
  window.addEventListener('unhandledrejection', (e) => toon('FOUT: ' + (e.reason && e.reason.stack || e.reason)));
</script>
<script type="module">
  // Hash: #<voertuig>. De driver (scripts/voertuigbeeld.mjs) roept window.neem(weergave) aan en haalt de PNG op.
  // Weergaven: buiten (recht van opzij), schuin (voor), achter (schuin van achter), binnen (uit de stoel, deuren open), open (deuren open).
  const root = location.href.replace(/docs\/beeld-24-11\/voertuigen\/pagina\.html.*$/, '');
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
  // #oud: de bouwer van voor deze ronde (een tijdelijke kopie game/js/_oud_voertuigen_tmp.js uit git, niet ingecheckt)
  const { buildVehicleMesh } = await import(root + (location.hash.includes('oud') ? 'game/js/_oud_voertuigen_tmp.js' : 'game/js/models3d_vehicles.js'));
  const { BOAT_KINDS } = await import(root + 'game/js/boattypes.js');
  const { syncVehicleDoors } = await import(root + 'game/js/vehicledoors3d.js');
  const { HERO_CAR_MODEL } = await import(root + 'game/js/vehicle.js');
  const naam = (location.hash || '#escapade').slice(1).replace('oud', '');
  const car = (name, len, wid, color, extra = {}) => ({ model: { name, len, wid, color }, ...extra });
  const SPECS = {
    escapade: { model: { ...HERO_CAR_MODEL }, isHeroCar: true },
    sedan: car('sedan', 4.3, 1.8, '#7a1f1f'), hatch: car('hatch', 3.8, 1.7, '#5a7392'),
    ambulance: car('van', 5.6, 2.0, '#f1d21c', { isAmbulance: true }),
    van: car('van', 5, 2, '#d9d9d9'), wagon: car('wagon', 4.5, 1.8, '#6e937c'),
    tractor: car('tractor', 4.3, 2.3, '#3f7d3a'), quad: car('quad', 2.1, 1.2, '#b8322a'),
    foodtruck: car('foodtruck', 5.4, 2.1, '#2f6fb0'), truck: car('truck', 8.5, 2.5, '#e8e6e0'),
    maaidorser: car('maaidorser', 7.4, 3.3, '#c43d2b'), laadmachine: car('laadmachine', 3.4, 1.8, '#e0a92b'),
    bus: { model: { name: 'bus', len: 11.2, wid: 2.55, trailer: 6.8, color: '#132a44', stripe: '#3fc6d4', accent: '#e8e6de' }, isBus: true },
    midibus: { model: { name: 'midibus', len: 8, wid: 2.4, color: '#0f3a4a', stripe: '#3fc6d4', accent: '#e8e6de' }, isBus: true },
    fiets: { model: { name: 'bike', len: 1.75, wid: 0.5, color: '#1c1c1c', rider: '#2f5c8a' }, isBike: true },
    fatbike: { model: { name: 'bike', fat: true, len: 1.95, wid: 0.62, color: '#20221f', rider: '#8a3a1f' }, isBike: true },
    step: { model: { name: 'scooter', len: 1.1, wid: 0.4, color: '#e8e6e0', rider: '#7a2e2e' }, isScooter: true },
    bromfiets: { model: { name: 'scooter', moped: true, len: 1.7, wid: 0.62, color: '#e6e1d6', rider: '#2f5c8a' }, isScooter: true },
    sloep: { model: { ...BOAT_KINDS.sloep }, isBoat: true }, rondvaart: { model: { ...BOAT_KINDS.rondvaart }, isBoat: true },
  };
  const spec = SPECS[naam] || SPECS.escapade;
  const W = 1920, H = 1080;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H);
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbfe3f2);
  scene.add(new THREE.HemisphereLight(0xf4f2ec, 0x2a3a2e, 1.7));
  const sun = new THREE.DirectionalLight(0xffffff, 2.4); sun.position.set(4, 8, 5); scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshLambertMaterial({ color: spec.isBoat ? 0x2b5566 : 0x6b7a66 }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);
  const v = { id: 700, health: 100, ...spec };
  const m = buildVehicleMesh(v);
  scene.add(m);
  m.userData.__v = v;
  // de camerapunten hangen aan de opgegeven maat en een vaste hoogte per soort, niet aan het gebouwde model: voor en na zijn zo gelijk
  const HOOG = { escapade: 1.5, sedan: 1.5, hatch: 1.5, wagon: 1.55, van: 2.3, ambulance: 2.6, tractor: 2.9, quad: 1.3, foodtruck: 3.1, truck: 3.5, maaidorser: 3.8, laadmachine: 2.5, bus: 3.2, midibus: 3.0, fiets: 1.9, fatbike: 1.9, step: 1.9, bromfiets: 1.9, sloep: 1.5, rondvaart: 2.5 };
  const size = new THREE.Vector3(spec.model.len, HOOG[naam] || 1.6, spec.model.wid), mid = new THREE.Vector3(0, 0, 0);
  const R = Math.max(size.x, size.z) * 0.5 + 1.2;
  const cam = new THREE.PerspectiveCamera(34, W / H, 0.05, 400);
  const open = (rollen) => { for (let k = 0; k < 40; k++) for (const rol of rollen) for (const side of [1, -1]) syncVehicleDoors(m, v, 0.05, { rol, open: true, side }); };
  let isOpen = false;
  const VIEWS = {
    // x = voor, z = rechts. Camera kijkt naar het midden van het voertuig.
    buiten: () => ({ p: [0, size.y * 0.6, R * 2.0], t: [0, size.y * 0.45, 0] }),
    schuin: () => ({ p: [R * 1.35, size.y * 0.95 + 0.3, R * 1.5], t: [0, size.y * 0.4, 0] }),
    achter: () => ({ p: [-R * 1.35, size.y * 0.95 + 0.3, R * 1.5], t: [0, size.y * 0.4, 0] }),
    open: () => ({ p: [R * 0.5, size.y * 1.6 + 0.4, R * 1.5], t: [0, size.y * 0.3, 0], doors: true }),
    binnen: () => ({ p: [-size.x * 0.2, Math.min(size.y * 0.78, 1.2), 0], t: [size.x * 0.35, Math.min(size.y * 0.5, 0.8), 0], fov: 72, doors: true }),
  };
  window.neem = (weergave) => {
    const w = VIEWS[weergave]();
    if (w.doors && !isOpen) { open(['bestuurder', 'bijrijder', 'achter']); isOpen = true; }
    cam.fov = w.fov || 34; cam.updateProjectionMatrix();
    cam.position.set(mid.x + w.p[0], w.p[1], mid.z + w.p[2]);
    cam.lookAt(mid.x + w.t[0], w.t[1], mid.z + w.t[2]);
    renderer.render(scene, cam);
    return renderer.domElement.toDataURL('image/png');
  };
  let tris = 0;
  m.traverse((o) => { if (o.isMesh && o.visible) { const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3; } });
  window.info = { tris: Math.round(tris), size: size.toArray().map((x) => +x.toFixed(2)), naam };
  document.title = 'klaar:' + naam;
</script>
