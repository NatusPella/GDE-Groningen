<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<!-- GDE Groningen app icon. Big Shoulders Display (SIL OFL 1.1, (c) 2019 The Big Shoulders Project Authors) is embedded as a subset of the letters GDERONI. -->
<defs>
<style>@font-face { font-family: 'BigShoulders'; font-weight: 800 900; src: url(data:font/woff2;base64,) format('woff2'); }
text { font-family: 'BigShoulders', 'Arial Narrow', sans-serif; }</style>
<radialGradient id="bg" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#1d3a26"/><stop offset="1" stop-color="#0a120c"/></radialGradient>
<linearGradient id="mark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0ede4"/><stop offset="0.52" stop-color="#f0ede4"/><stop offset="1" stop-color="#3fc97a"/></linearGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16" result="b"/><feFlood flood-color="#3fc97a" flood-opacity="0.4"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="drop" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/></filter>
<filter id="plate" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/></filter>
</defs>
<rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#drop)"/>
<rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#3fc97a" stroke-opacity="0.55" stroke-width="10"/>
<text x="512" y="600" font-size="460" font-weight="900" text-anchor="middle" letter-spacing="8" fill="url(#mark)" filter="url(#glow)">GDE</text>
<g filter="url(#plate)" transform="translate(0 -22)">
  <rect x="196" y="664" width="632" height="150" rx="30" fill="#1e9e56"/>
  <rect x="213" y="681" width="598" height="116" rx="18" fill="none" stroke="#fff" stroke-width="13"/>
  <text x="512" y="776" font-size="112" font-weight="800" text-anchor="middle" textLength="510" lengthAdjust="spacing" fill="#fff">GRONINGEN</text>
</g>
</svg>
